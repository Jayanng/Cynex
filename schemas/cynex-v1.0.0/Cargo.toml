[package]
name = "cynex-schema"
version = "1.0.0"
edition = "2021"
description = "Cynex schema and hashing for version 1.0.0, frozen. No contract logic lives here, only the shared types and the two hashes contract and frontend must reproduce byte for byte."
license = "MIT"

[lib]
name = "cynex_schema"
path = "src/lib.rs"

[dependencies]
sha2 = "0.10"

[dev-dependencies]
serde_json = "1.0"

[profile.release]
overflow-checks = true
