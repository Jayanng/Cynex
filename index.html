<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cynex — Pay the obligation. Not the prompt.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{
  --bg:#04060a; --panel:rgba(12,17,25,.78); --panel2:rgba(7,11,17,.9);
  --line:rgba(148,163,184,.14); --line2:rgba(148,163,184,.08);
  --txt:#dbe4ee; --dim:#7d8ba0; --dim2:#55637a;
  --green:#34d399; --red:#f87171; --amber:#fbbf24; --cyan:#7dd3fc;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:linear-gradient(rgba(148,163,184,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.045) 1px,transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(ellipse 90% 60% at 50% 0%,black 25%,transparent 78%);
          mask-image:radial-gradient(ellipse 90% 60% at 50% 0%,black 25%,transparent 78%);}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 60% 40% at 50% -10%,rgba(52,211,153,.07),transparent 70%);}
#app,header,footer{position:relative;z-index:1}
.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.dim{color:var(--dim)} .dim2{color:var(--dim2)}
a{color:#9fd8ff;text-decoration:none} a:hover{color:#c4e8ff}
h1,h2,h3{font-weight:700;letter-spacing:-.02em}
.kicker{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--green)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(6px)}
.panel-h{transition:border-color .25s,transform .25s}
.panel-h:hover{border-color:rgba(52,211,153,.35)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px 18px;font-weight:600;font-size:14px;color:var(--txt);background:rgba(255,255,255,.03);cursor:pointer;transition:all .2s;white-space:nowrap}
.btn:hover{border-color:rgba(52,211,153,.5);color:#fff;background:rgba(52,211,153,.06)}
.btn-primary{background:linear-gradient(180deg,rgba(52,211,153,.2),rgba(52,211,153,.07));border-color:rgba(52,211,153,.5);color:#a7f3d0}
.btn-primary:hover{background:linear-gradient(180deg,rgba(52,211,153,.3),rgba(52,211,153,.12));color:#d1fae5}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:8px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.input{background:#05090f;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;color:var(--txt);outline:none;font-family:'JetBrains Mono',monospace}
.input:focus{border-color:rgba(52,211,153,.5)}
.badge{display:inline-flex;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:.1em;padding:4px 11px;border-radius:999px;border:1px solid;text-transform:uppercase;white-space:nowrap}
.badge .bdot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.b-paid,.b-allow,.b-ok{color:var(--green);border-color:rgba(52,211,153,.45);background:rgba(52,211,153,.08)}
.b-refused,.b-blocked{color:var(--red);border-color:rgba(248,113,113,.45);background:rgba(248,113,113,.08)}
.b-warn{color:var(--amber);border-color:rgba(251,191,36,.45);background:rgba(251,191,36,.08)}
.b-dim{color:var(--dim);border-color:var(--line);background:rgba(148,163,184,.06)}
.codechip{font-family:'JetBrains Mono',monospace;font-size:11px;color:#fca5a5;border:1px solid rgba(248,113,113,.35);background:rgba(248,113,113,.07);border-radius:7px;padding:3px 8px;white-space:nowrap}
.hashchip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:rgba(2,6,12,.65);border-radius:8px;padding:3px 5px 3px 10px;font-size:12.5px;color:#a9c6de;font-family:'JetBrains Mono',monospace;max-width:100%}
.icbtn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;color:var(--dim);cursor:pointer;border:none;background:transparent;flex:none;transition:all .15s;padding:0}
.icbtn:hover{background:rgba(255,255,255,.07);color:#fff}
.icbtn svg{width:13px;height:13px}
.icbtn.copied{color:var(--green)}
.cmd{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#02060c;border:1px solid var(--line);border-radius:10px;padding:13px 15px;font-size:13px;overflow-x:auto}
.cmd code{color:#9be7c4;white-space:pre;font-family:'JetBrains Mono',monospace}
.cmd .icbtn{width:26px;height:26px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(7,11,17,.85)}
.strip-cell{padding:14px 16px;border-right:1px solid var(--line2);min-width:0}
.strip-cell:last-child{border-right:0}
.strip-label{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim2);margin-bottom:7px;font-weight:600}
.strip-val{font-family:'JetBrains Mono',monospace;font-size:12.5px;display:flex;align-items:center;gap:8px;min-height:22px;color:#c3d3e4;flex-wrap:wrap}
@media(max-width:1150px){.strip{grid-template-columns:repeat(3,1fr)}.strip-cell{border-bottom:1px solid var(--line2)}}
@media(max-width:640px){.strip{grid-template-columns:repeat(2,1fr)}}
.livedot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none;animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}70%{box-shadow:0 0 0 9px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.livedot.err{background:var(--amber);animation:none}
.spin{width:12px;height:12px;border:2px solid rgba(251,191,36,.25);border-top-color:var(--amber);border-radius:50%;animation:rot .9s linear infinite;display:inline-block;flex:none}
.spin.g{border-color:rgba(52,211,153,.2);border-top-color:var(--green)}
@keyframes rot{to{transform:rotate(360deg)}}
.unavail{color:var(--amber);display:inline-flex;align-items:center;gap:7px;font-size:12px}
.loadtxt{color:var(--dim);display:inline-flex;align-items:center;gap:7px;font-size:12px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim2);padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line2);font-family:'JetBrains Mono',monospace;vertical-align:middle;color:#b8c8da}
.tbl tbody tr{transition:background .15s;cursor:default}
.tbl tbody tr:hover td{background:rgba(255,255,255,.025)}
.tbl tbody tr.clickable{cursor:pointer}
.step{display:grid;grid-template-columns:52px 1fr;gap:18px;position:relative}
.rail{display:flex;flex-direction:column;align-items:center}
.node{width:40px;height:40px;border-radius:12px;border:1px solid rgba(52,211,153,.4);display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--green);background:#070b11;flex:none}
.node.attack{color:var(--red);border-color:rgba(248,113,113,.4)}
.node.gate{color:var(--amber);border-color:rgba(251,191,36,.4)}
.rail .line{flex:1;width:1px;background:linear-gradient(var(--line),transparent);margin-top:8px;min-height:20px}
.attempt{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 14px;border:1px solid var(--line2);border-radius:10px;background:rgba(2,6,12,.4)}
.att-label{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#b8c8da}
.terms-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line2);border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.term{background:rgba(4,8,13,.7);padding:10px 13px;min-width:0}
.term .tl{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim2);margin-bottom:4px}
.term .tv{font-family:'JetBrains Mono',monospace;font-size:12px;color:#c3d3e4;word-break:break-all}
.navlink{padding:8px 14px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--dim);transition:all .15s;position:relative}
.navlink:hover{color:#fff}
.navlink.active{color:#fff;background:rgba(255,255,255,.05)}
.navlink.active::after{content:'';position:absolute;left:14px;right:14px;bottom:2px;height:2px;border-radius:2px;background:var(--green)}
.netpill{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:11px;color:var(--dim);letter-spacing:.06em}
pre.codeblock{background:#02060c;border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.65;color:#9be7c4;overflow-x:auto;position:relative}
pre.codeblock.dimc{color:#8fa5bd}
.copyfloat{position:absolute;top:8px;right:8px}
.docsec{scroll-margin-top:96px}
.docside a{display:block;padding:7px 12px;border-radius:8px;font-size:13px;color:var(--dim);transition:all .15s;border-left:2px solid transparent}
.docside a:hover{color:#fff;background:rgba(255,255,255,.03)}
.docside a.active{color:var(--green);border-left-color:var(--green);background:rgba(52,211,153,.05)}
mark{background:rgba(251,191,36,.3);color:#fde68a;border-radius:3px;padding:0 2px}
.callout{border:1px solid rgba(251,191,36,.4);background:rgba(251,191,36,.06);border-radius:12px;padding:14px 18px}
.callout.red{border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.06)}
.callout.green{border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.05)}
.hero-h{font-size:clamp(42px,6.2vw,84px);line-height:1.0;letter-spacing:-.035em;font-weight:800}
.grad{background:linear-gradient(92deg,#e6f7ee 10%,#34d399 55%,#38bdf8 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.row-ok td{background:rgba(52,211,153,.05)!important}
.row-bad td{background:rgba(248,113,113,.08)!important}
.logline{font-family:'JetBrains Mono',monospace;font-size:12px;padding:6px 10px;border-radius:7px;display:flex;gap:10px;align-items:center}
.logline.ok{color:#86efac;background:rgba(52,211,153,.05)}
.logline.bad{color:#fca5a5;background:rgba(248,113,113,.08)}
.logline.inf{color:#93c5fd;background:rgba(147,197,253,.05)}
.logline.diml{color:var(--dim)}
.togglebtn{padding:8px 18px;border-radius:9px;font-size:13px;font-weight:600;color:var(--dim);border:1px solid transparent;transition:all .15s}
.togglebtn.active{color:#a7f3d0;background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.4)}
.togglebtn:not(.active):hover{color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#04060a}
::-webkit-scrollbar-thumb{background:#1b2534;border-radius:6px;border:2px solid #04060a}
::selection{background:rgba(52,211,153,.25)}
.fadein{animation:fadein .45s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<header class="fixed top-0 left-0 right-0 z-50 border-b" style="background:rgba(4,6,10,.85);backdrop-filter:blur(12px);border-color:var(--line)">
  <div class="wrap flex items-center justify-between h-16 gap-4">
    <a href="#/" class="flex items-center gap-3 flex-none">
      <span class="grid place-items-center w-9 h-9 rounded-xl border" style="border-color:rgba(52,211,153,.45);background:rgba(52,211,153,.08)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><circle cx="12" cy="10" r="2.2"/><path d="M12 12.2v3.3"/></svg>
      </span>
      <span class="leading-tight">
        <span class="block font-extrabold tracking-tight text-white text-[17px]">CYNEX</span>
        <span class="hidden md:block text-[10px] mono dim2 tracking-widest uppercase">purpose-bound settlement vault</span>
      </span>
    </a>
    <nav class="flex items-center gap-1" id="mainnav">
      <a class="navlink" data-nav="landing" href="#/">Landing</a>
      <a class="navlink" data-nav="demo" href="#/demo/guided">Demo</a>
      <a class="navlink" data-nav="docs" href="#/docs">Docs</a>
      <a class="navlink" data-nav="proof" href="#/proof">Proof</a>
    </nav>
    <div class="netpill mono flex-none" title="Live RPC: test.rpc.fastnear.com">
      <span class="livedot" id="netdot"></span><span id="nettxt">TESTNET</span>
    </div>
  </div>
</header>

<main id="app" class="pt-16 min-h-screen"></main>

<script>
/* ============================================================
   CYNEX — presentation layer. Reads live chain state via RPC.
   No wallet, no login, no writes. Testnet only.
   ============================================================ */

const RPC_URL   = 'https://test.rpc.fastnear.com';
const VAULT_PROD= 'cynex-vault.cynexmaster.testnet';
const VAULT_TEST= 'cynex-testvault.cynexmaster.testnet';
const AGENT     = 'cynex-agent.cynexmaster.testnet';
const TOKEN     = 'usdc.fakes.testnet';
const REPO      = 'https://github.com/Jayanng/Cynex';

/* ---------- demo token (live mode) — KEY NOT YET SUPPLIED ----------
   Johnson creates this key (via Muse) on the TEST vault only and sends
   it separately. Adejoke does not create it and does not hold the owner key.
   Until every field below is filled in by hand from Johnson's message,
   live mode stays DISABLED and the page uses the simulated panel only.
   NEVER paste the existing executor key, the owner key, or any
   full-access key here. The demo key is: fresh, settle-only on the test
   vault, allowance 0.05 NEAR, testnet only, low value.
   The two obligation ids must also come from Johnson:
   - readyObligationId: a READY demo obligation (evidence submitted,
     never settled) for the recipient/amount attacks. p10-demo-attack-001
     is PAID, so it would return NONCE_ALREADY_CONSUMED, not the
     recipient/amount codes — do NOT use it for those attacks.
   - pendingObligationId: a CREATED / EVIDENCE_PENDING demo obligation
     (no evidence submitted) for the remove-evidence attack. */
const DEMO_TOKEN = {
  enabled: false,
  accountId: '',        // demo key account, supplied by Johnson
  publicKey: '',        // demo key public key, supplied by Johnson
  privateKey: '',       // demo key private key, supplied by Johnson — ed25519:...
  readyObligationId: '',   // READY demo obligation, supplied by Johnson
  pendingObligationId: '' // not-yet-evidenced demo obligation, supplied by Johnson
};
const DEMO_ATTACKER = 'attacker.testnet'; // tampered recipient used only for live attempts; the vault refuses before any transfer
const DEMO_LIVE_LABEL = 'Demo key — testnet only, scoped to settle on the test vault, low allowance. This key can only attempt settles; the vault decides.';
const COMMIT    = '61db7a2';
const EX_TX     = h => 'https://testnet.nearblocks.io/txns/' + h;
const EX_ADDR   = a => 'https://testnet.nearblocks.io/address/' + a;

/* ---------- icons ---------- */
const svg = p => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';
const IC = {
  copy:  svg('<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>'),
  ext:   svg('<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/>'),
  check: svg('<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/>'),
  x:     svg('<circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/>'),
  warn:  svg('<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/>'),
  arrow: svg('<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>'),
  refresh: svg('<path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>'),
  lock:  svg('<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>')
};

/* ---------- copy registry (commands with quotes live here) ---------- */
const CP = {
  verify:    'npx cynex-verify --vault cynex-testvault.cynexmaster.testnet --rpc https://test.rpc.fastnear.com',
  verifyCsv: 'npx cynex-verify --vault cynex-testvault.cynexmaster.testnet --rpc https://test.rpc.fastnear.com --csv > receipts.csv',
  verifyProd:'npx cynex-verify --vault cynex-vault.cynexmaster.testnet --rpc https://test.rpc.fastnear.com',
  curlProd:  'curl -s https://test.rpc.fastnear.com -H "content-type: application/json" -d \'{"jsonrpc":"2.0","id":"1","method":"query","params":{"request_type":"view_code","finality":"final","account_id":"cynex-vault.cynexmaster.testnet"}}\'',
  coldrun:   'git clone https://github.com/Jayanng/Cynex.git\ncd Cynex\nnpm install\nnpm test            # Jest — 19 suites, 369 tests passing\nnpm run conformance # 6/6\nnpx cynex-verify --vault cynex-testvault.cynexmaster.testnet --rpc https://test.rpc.fastnear.com',
  att13324:  'npx cynex-verify --bundle demo/attestations/prod-tee-001.json --request 13324 --rpc https://test.rpc.fastnear.com',
  att10640:  'npx cynex-verify --bundle demo/attestations/10640.json --request 10640 --rpc https://test.rpc.fastnear.com',
  att11912:  'npx cynex-verify --bundle demo/attestations/11912.json --request 11912 --rpc https://test.rpc.fastnear.com',
  att13040:  'npx cynex-verify --bundle demo/attestations/13040.json --request 13040 --rpc https://test.rpc.fastnear.com'
};

/* ---------- helpers ---------- */
const trunc = (h,a=8,b=6) => !h ? '—' : (h.length > a+b+1 ? h.slice(0,a)+'…'+h.slice(-b) : h);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function fmtToken(raw){
  try{ const b=BigInt(raw); const w=b/1000000n; let f=(b%1000000n).toString().padStart(6,'0').replace(/0+$/,'');
    return (f? w+'.'+f : ''+w); }catch(e){ return String(raw); }
}
function fmtTs(t){
  const s=String(t); const n=Number(s); if(!isFinite(n)) return esc(s);
  const ms = s.length>13 ? n/1e6 : n;
  try{ return new Date(ms).toISOString().replace('T',' ').slice(0,19)+'Z'; }catch(e){ return esc(s); }
}
function hashChip(h,type='tx'){
  if(!h) return '<span class="dim mono">—</span>';
  const href = type==='acct' ? EX_ADDR(h) : EX_TX(h);
  return '<span class="hashchip" title="'+esc(h)+'"><span>'+esc(trunc(h))+'</span>'
    +'<button class="icbtn" data-copy="'+esc(h)+'" title="Copy full hash">'+IC.copy+'</button>'
    +'<a class="icbtn" href="'+href+'" target="_blank" rel="noopener" title="Open in explorer">'+IC.ext+'</a></span>';
}
const acctChip = a => hashChip(a,'acct');
function miniHash(h){
  if(!h) return '<span class="dim">—</span>';
  return '<span class="inline-flex items-center gap-1" title="'+esc(h)+'"><span>'+esc(trunc(h,8,6))+'</span>'
    +'<button class="icbtn" data-copy="'+esc(h)+'" title="Copy">'+IC.copy+'</button></span>';
}
function badge(v, extra){
  const m={PAID:'b-paid',ALLOW:'b-allow',OK:'b-ok',REFUSED:'b-refused',BLOCKED:'b-blocked',BLOCK:'b-blocked',WARN:'b-warn'};
  const cls=m[v]||'b-dim';
  return '<span class="badge '+cls+'"><span class="bdot"></span>'+v+'</span>' + (extra? ' <span class="codechip">'+esc(extra)+'</span>':'');
}
function cmdBlock(key, label){
  const txt = CP[key];
  const first = txt.split('\n')[0];
  return '<div class="cmd"><code>'+esc(label||first)+'</code><button class="icbtn" data-cp="'+key+'" title="Copy command">'+IC.copy+'</button></div>';
}
const unavail = () => '<span class="unavail"><span class="spin"></span>Unavailable — retrying</span>';
const loadtxt = () => '<span class="loadtxt"><span class="spin g"></span>Loading live data…</span>';

/* ============================================================
   GROUND-TRUTH RECORD — live demo, already executed on the
   test vault. Historical facts (tx hashes), not live numbers.
   ============================================================ */
const GUIDED = [
  { n:'01', anchor:'step1', cls:'', title:'Happy path — PREIMAGE evidence', ob:'p10-demo-preimage-001',
    desc:'The agent delivers artifact p6-001 and presents its SHA-256 preimage. The vault verifies the evidence against the obligation, enforces the fixed terms, and settles 100 USDC to the agent. No human in the loop — the contract checked everything.',
    terms:[['recipient',AGENT],['token',TOKEN],['amount','100 USDC'],['nonce','1001'],['evidence','PREIMAGE — SHA-256(delivery artifact p6-001)']],
    attempts:[ {label:'settle · correct terms · valid preimage', verdict:'PAID', tx:'3Gp3J2zZCKrne1PamDVf6PgXHk4qGc3a58GBvoFcNhrZ', note:'receipt #11'} ],

/* ============================================================
   RPC LAYER — live reads only. On failure: unavailable, retry.
   ============================================================ */
async function rpc(method, params, timeout=12000){
  const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), timeout);
  try{
    const res = await fetch(RPC_URL, {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({jsonrpc:'2.0', id:String(Date.now()), method, params}), signal: ctl.signal});
    const j = await res.json();
    if(j.error) throw new Error(typeof j.error==='object' ? (j.error.message||'rpc error') : String(j.error));
    return j.result;
  } finally { clearTimeout(t); }
}
async function viewCode(accountId){
  const r = await rpc('query', {request_type:'view_code', finality:'final', account_id:accountId});
  if(r && r.hash) return {hash:r.hash, block:r.block_height};
  throw new Error('no code hash');
}
async function viewCall(accountId, method, args){
  const r = await rpc('query', {request_type:'call_function', finality:'final', account_id:accountId,
    method_name:method, args_base64: btoa(JSON.stringify(args||{}))});
  if(r && r.result){
    const txt = new TextDecoder().decode(new Uint8Array(r.result));
    return {data: txt ? JSON.parse(txt) : null, block: r.block_height};
  }
  throw new Error('view call failed');
}
async function fetchReceipts(vault){
  let out=[], start=0; const limit=50; let block=null;
  for(let i=0;i<10;i++){
    const r = await viewCall(vault,'receipts',{start, limit});
    block = r.block;
    const page = Array.isArray(r.data) ? r.data : (r.data && Array.isArray(r.data.receipts) ? r.data.receipts : []);
    if(page.length===0) break;
    out = out.concat(page);
    if(page.length < limit) break;
    start += limit;
  }
  return {rows: out, block};
}
async function fetchPolicy(){
  const methods=['policy','get_policy','budget_policy','get_budget_policy','budget'];
  for(const m of methods){
    try{ const r = await viewCall(VAULT_TEST, m, {}); if(r.data!=null) return {method:m, raw:r.data, block:r.block}; }catch(e){}
  }
  throw new Error('no policy view');
}
async function receiptHash(r){
  const s = '' + r.index + r.prev_hash + r.obligation_id + r.recipient + r.amount + r.token_id + r.timestamp + r.tx_ref;
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function computeLinkage(rows){
  if(!rows || !rows.length) return {allOk:null, perRow:[]};
  const perRow = rows.map((r,i)=>{
    if(i===0) return true;
    const p = rows[i-1];
    const contig = Number(r.index) === Number(p.index)+1;
    if(p.hash && r.prev_hash) return contig && r.prev_hash === p.hash;
    return contig;
  });
  return {allOk: perRow.every(Boolean), perRow};
}

async function refreshLive(){
  if(refreshing) return; refreshing=true;
  clearTimeout(retryTimer);
  renderLiveRegions();
  const jobs = [
    ['codeProd', viewCode(VAULT_PROD)],
    ['codeTest', viewCode(VAULT_TEST)],
    ['recProd',  fetchReceipts(VAULT_PROD)],
    ['recTest',  fetchReceipts(VAULT_TEST)],
    ['agent',    viewCall(TOKEN,'ft_balance_of',{account_id:AGENT})],
    ['policy',   fetchPolicy()]
  ];
  const settled = await Promise.allSettled(jobs.map(j=>j[1]));
  let anyErr=false, block=null;
  settled.forEach((s,i)=>{
    const key = jobs[i][0];
    if(s.status==='fulfilled'){
      const val = s.value;
      if(key==='codeProd'||key==='codeTest'){ live[key]={v:val.hash,err:false}; block = block||val.block; }
      else if(key==='recProd'||key==='recTest'){
        live[key]={v:val.rows.length, err:false, rows:val.rows, link:computeLinkage(val.rows)};
        block = block||val.block;
      }
      else if(key==='agent'){ live.agent={v:val.data, err:false}; block=block||val.block; }
      else if(key==='policy'){ live.policy={v:val, err:false}; block=block||val.block; }
    } else {
      live[key].err = true; anyErr = true;
    }
  });
  live.anyErr = anyErr;
  if(block) live.blockHeight = block;
  live.checkedAt = new Date();
  refreshing=false;
  renderLiveRegions();
  if(anyErr) retryTimer = setTimeout(refreshLive, 8000);
}

function policyText(p){
  if(!p) return '';
  const raw = p.raw || {};
  if(typeof raw==='object'){
    const spent = raw.spent ?? raw.total_spent ?? raw.used ?? null;
    const limit = raw.limit ?? raw.cap ?? raw.max ?? raw.max_spend ?? raw.budget ?? null;
    if(spent!=null && limit!=null){
      try{ const head = (BigInt(limit)-BigInt(spent)).toString();
        return 'spent '+fmtToken(spent)+' · headroom '+fmtToken(head)+' USDC';
      }catch(e){}
    }
    return '<span title="'+esc(JSON.stringify(raw))+'">'+esc(trunc(JSON.stringify(raw),18,8))+'</span>';
  }
  return esc(String(raw));
}

async function initTamper(id){
  const root = document.getElementById('tamper-'+id);
  if(!root) return;
  const q = s => root.querySelector('[data-t="'+s+'"]');
  const log = q('log'), pick=q('pick'), src=q('src');
  let chain=[], base=[];
  const randB58 = n => { const a='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz'; let s=''; for(let i=0;i<n;i++) s+=a[Math.floor(Math.random()*a.length)]; return s; };
  async function build(){
    log.innerHTML='<div class="logline diml">building working copy…</div>';
    base=[];
    if(live.recTest.rows && live.recTest.rows.length>=3){
      for(const r of live.recTest.rows.slice(0,12)){
        const c={index:r.index, prev_hash:r.prev_hash, obligation_id:r.obligation_id, recipient:r.recipient, amount:String(r.amount), token_id:r.token_id, timestamp:String(r.timestamp), tx_ref:r.tx_ref};
        c.hash = await receiptHash(c);
        base.push(c);
      }
      src.textContent='source: live receipts · '+VAULT_TEST+' ('+base.length+' rows, browser-recomputed hashes)';
    } else {
      let prev='0'.repeat(64);
      const seed=[['pg-alpha','25'],['pg-beta','40'],['pg-gamma','60'],['pg-delta','15'],['pg-epsilon','80'],['pg-zeta','30']];
      for(let i=0;i<seed.length;i++){
        const c={index:i, prev_hash:prev, obligation_id:seed[i][0], recipient:AGENT, amount:(BigInt(seed[i][1])*1000000n).toString(), token_id:TOKEN, timestamp:String(1762531200000000000 + i*60000000000), tx_ref:randB58(44)};
        c.hash=await receiptHash(c); prev=c.hash; base.push(c);
      }
      src.textContent='source: SYNTHETIC — generated locally in your browser (live receipts unavailable). Not chain data.';
    }
    reset();
  }
  function reset(){
    chain = base.map(c=>({...c}));
    pick.innerHTML = chain.map(c=>'<option value="'+c.index+'">receipt #'+c.index+' · '+esc(c.obligation_id)+' · '+fmtToken(c.amount)+' USDC</option>').join('');
    log.innerHTML = '<div class="logline diml">working copy ready · '+chain.length+' receipts · hash = SHA-256(index ‖ prev_hash ‖ obligation_id ‖ recipient ‖ amount ‖ token_id ‖ timestamp ‖ tx_ref)</div>';
  }
  q('tamper').onclick = async ()=>{
    const idx = Number(pick.value);
    const r = chain.find(c=>Number(c.index)===idx);
    if(!r) return;
    r.amount = (BigInt(r.amount)+1000000n).toString();
    r.hash = await receiptHash(r); // attacker recomputes to cover tracks
    log.innerHTML = '<div class="logline bad">tampered receipt #'+idx+' — amount '+fmtToken(String(BigInt(r.amount)-1000000n))+' → '+fmtToken(r.amount)+' USDC · stored hash recomputed by the attacker</div>'
      + '<div class="logline diml">now run the verifier replay.</div>';
  };
  q('verify').onclick = async ()=>{
    log.innerHTML='';
    let broke=false;
    for(let k=0;k<chain.length;k++){
      const r=chain[k];
      const recomputed = await receiptHash(r);
      const integrity = recomputed===r.hash;
      const link = k===0 ? true : chain[k].prev_hash === (await receiptHash(chain[k-1]));
      await new Promise(res=>setTimeout(res,90));
      if(integrity && link && !broke){
        log.insertAdjacentHTML('beforeend','<div class="logline ok fadein">#'+r.index+' · recompute ok · link ok</div>');
      } else if(!broke){
        broke=true;
        log.insertAdjacentHTML('beforeend','<div class="logline bad fadein">#'+r.index+' · MISMATCH — prev_hash ≠ recomputed hash of receipt '+(k-1)+' · chain broken here</div>');
      } else {
        log.insertAdjacentHTML('beforeend','<div class="logline bad fadein">#'+r.index+' · untrusted — chain already broken</div>');
      }
    }
    log.insertAdjacentHTML('beforeend','<div class="logline '+(broke?'bad':'ok')+' fadein" style="font-weight:600">'+(broke? 'tamper in receipt i was detected at i+1 — exactly as designed.' : 'no tamper detected — chain intact.')+'</div>');
  };
  q('reset').onclick = reset;
  await build();
}

/* ---------- Demo-token live mode ----------
   Flow: (1) confirm the demo key is configured; (2) read the target
   obligation live and confirm its state is the one this attack needs;
   (3) sign a real settle call with the demo key via near-api-js (loaded
   on demand from the jsDelivr +esm build of near-api-js@7, the same major
   version the repo uses); (4) the vault refuses on chain — show the error
   code, the real refusal tx hash, and "0 tokens moved"; (5) re-read the
   obligation to prove nothing moved. Any failure that is NOT a vault
   refusal (network, RPC, key exhausted, wrong obligation state) is
   reported plainly and falls back to the simulated panel — never
   presented as a refusal, and never a silent mode switch. */
let najPromise = null;
function loadNearApiJs(){
  if(window.__nearApiJs) return Promise.resolve(window.__nearApiJs);
  if(!najPromise){
    najPromise = import('https://cdn.jsdelivr.net/npm/near-api-js@7/+esm')
      .then(m => { window.__nearApiJs = m; return m; })
      .catch(e => { najPromise = null; throw e; });
  }
  return najPromise;
}
function liveStatus(text, cls){
  const el = document.getElementById('live-status');
  if(el){ el.className = 'badge ' + (cls || 'b-dim'); el.innerHTML = '<span class="bdot"></span>' + esc(text); }
}
function liveOut(html){ const el = document.getElementById('live-out'); if(el) el.innerHTML = html; }
function demoKeyConfigured(){
  return !!(DEMO_TOKEN.enabled && DEMO_TOKEN.accountId && DEMO_TOKEN.publicKey && DEMO_TOKEN.privateKey
    && DEMO_TOKEN.readyObligationId && DEMO_TOKEN.pendingObligationId);
}
function liveTargetId(b){
  if(b.live.obligation === 'ready') return DEMO_TOKEN.readyObligationId;
  if(b.live.obligation === 'pending') return DEMO_TOKEN.pendingObligationId;
  return b.live.obligation;
}
function errCodeFromText(txt){
  const m = String(txt || '').match(/ERR_[A-Z_]+/);
  return m ? m[0] : null;
}
function txHashFromError(e){
  const cands = [e && e.transaction && e.transaction.hash, e && e.context && e.context.transaction && e.context.transaction.hash,
    e && e.outcome && e.outcome.transaction && e.outcome.transaction.hash, e && e.transactionHash];
  for(const c of cands){ if(typeof c === 'string' && c.length >= 40) return c; }
  const m = String((e && e.message) || e || '').match(/[1-9A-HJ-NP-Za-km-z]{43,44}/);
  return m ? m[0] : null;
}
function isKeyExhausted(e){
  const s = String((e && e.message) || e || '').toLowerCase();
  return s.indexOf('allowance') >= 0 || s.indexOf('not enough balance') >= 0 || s.indexOf('does not have enough') >= 0
    || s.indexOf('access key') >= 0 || s.indexOf('key') >= 0 && s.indexOf('does not exist') >= 0;
}
async function readObligationState(obligationId){
  const r = await viewCall(VAULT_TEST, 'get_obligation', {obligation_id: obligationId});
  const d = r.data;
  if(!d) return null;
  return {state: String(d.state || ''), inFlight: !!d.in_flight, recipient: d.recipient, amount: String(d.amount)};
}
async function tryLiveAttack(i){
  const b = BREAK_IT[i];
  liveStatus('checking…', 'b-warn');
  if(!demoKeyConfigured()){
    liveAvailable = false;
    liveUnavailableReason = 'Live mode is not configured yet — the demo key has not been supplied by Johnson. Showing the simulated refusal instead.';
    liveStatus('not configured', 'b-dim');
    liveOut('<div class="callout mono text-[12.5px]" style="color:#fde68a">' + esc(liveUnavailableReason) + '</div>');
    return;
  }
  const targetId = liveTargetId(b);
  liveOut('<div class="mt-1">' + loadtxt() + ' <span class="dim text-[12px]">reading target obligation ' + esc(targetId) + ' from the test vault…</span></div>');
  let before;
  try{
    before = await readObligationState(targetId);
  }catch(e){
    liveAvailable = false;
    liveUnavailableReason = 'Live mode unavailable: could not read the target obligation from the chain (' + esc(String(e && e.message || e)) + '). Showing the simulated refusal instead.';
    liveStatus('unavailable', 'b-warn');
    liveOut('<div class="callout mono text-[12.5px]" style="color:#fde68a">' + esc(liveUnavailableReason) + '</div>');
    return;
  }
  if(!before){
    liveAvailable = false;
    liveUnavailableReason = 'Live mode unavailable: obligation ' + targetId + ' was not found on the test vault. Showing the simulated refusal instead.';
    liveStatus('unavailable', 'b-warn');
    liveOut('<div class="callout mono text-[12.5px]" style="color:#fde68a">' + esc(liveUnavailableReason) + '</div>');
    return;
  }
  const need = b.live.expectState;
  const stateOk = need === 'READY' ? (before.state === 'READY' && !before.inFlight)
    : need === 'PAID' ? (before.state === 'PAID')
    : (before.state !== 'READY' && before.state !== 'PAID' && !before.inFlight);
  if(!stateOk){
    liveAvailable = false;
    liveUnavailableReason = 'Live mode unavailable for this attack right now: obligation ' + targetId + ' is ' + before.state + (before.inFlight ? ' (in flight)' : '') + ', but this attack needs it ' + (need === 'NOT_READY' ? 'not READY and not PAID' : need) + '. The obligation may have been settled or its state may have moved — Johnson needs to supply a fresh demo obligation. Showing the simulated refusal instead.';
    liveStatus('unavailable', 'b-warn');
    liveOut('<div class="callout mono text-[12.5px]" style="color:#fde68a">' + esc(liveUnavailableReason) + '</div>');
    return;
  }
  const receiptsBefore = live.recTest && live.recTest.rows ? live.recTest.rows.length : null;
  liveOut('<div class="mt-1">' + loadtxt() + ' <span class="dim text-[12px]">signing a real settle call with the demo key…</span></div>');
  let naj;
  try{
    naj = await loadNearApiJs();
  }catch(e){
    liveAvailable = false;
    liveUnavailableReason = 'Live mode unavailable: near-api-js could not be loaded from the CDN (' + esc(String(e && e.message || e)) + '). Showing the simulated refusal instead.';
    liveStatus('unavailable', 'b-warn');
    liveOut('<div class="callout mono text-[12.5px]" style="color:#fde68a">' + esc(liveUnavailableReason) + '</div>');
    return;
  }
  let txHash = null, code = null, outcome = null, threw = null;
  try{
    const provider = new naj.JsonRpcProvider({url: RPC_URL});
    const signer = naj.KeyPairSigner.fromSecretKey(DEMO_TOKEN.privateKey);
    const account = new naj.Account(DEMO_TOKEN.accountId, provider, signer);
    outcome = await account.callFunctionRaw({
      contractId: VAULT_TEST,
      methodName: 'settle',
      args: {obligation_id: targetId, proposed_recipient: b.live.recipient, proposed_amount: b.live.amount, evidence_ref: ''},
      gas: 100000000000000n
    });
    txHash = outcome && outcome.transaction ? outcome.transaction.hash : null;
  }catch(e){
    threw = e;
    txHash = txHashFromError(e);
    code = errCodeFromText(e);
    if(!code && e && e.message) code = errCodeFromText(String(e.message));
  }
  if(!threw){
    // An attack must never succeed. If it did, say so loudly — do not present a pay-out as a refusal.
    liveAvailable = false;
    liveStatus('unexpected success', 'b-warn');
    liveOut('<div class="callout red mono text-[12.5px]">Unexpected: the live settle attempt SUCCEEDED (tx ' + esc(txHash || 'unknown') + '). This attack was supposed to be refused. Do not trust this panel — the demo obligation may have been consumed. Showing the simulated refusal instead.</div>');
    return;
  }
  if(!txHash){
    liveAvailable = false;
    liveUnavailableReason = 'The live attempt failed, but no transaction hash could be recovered, so it is NOT shown as a refusal. Error: ' + esc(String(threw && threw.message || threw)) + '. Showing the simulated refusal instead.';
    liveStatus('unavailable', 'b-warn');
    liveOut('<div class="callout mono text-[12.5px]" style="color:#fde68a">' + esc(liveUnavailableReason) + '</div>');
    return;
  }
  if(isKeyExhausted(threw)){
    liveAvailable = false;
    liveUnavailableReason = 'The demo key is exhausted (allowance used up) or its key is no longer valid. Live mode is off until Johnson supplies a fresh demo key. Showing the simulated refusal instead.';
    liveStatus('key exhausted', 'b-warn');
    liveOut('<div class="callout mono text-[12.5px]" style="color:#fde68a">' + esc(liveUnavailableReason) + '</div>');
    return;
  }
  if(!code){
    liveAvailable = false;
    liveUnavailableReason = 'The live attempt failed, but the vault refusal code could not be read from the error, so it is NOT shown as a refusal. Tx ' + txHash + '. Error: ' + esc(String(threw && threw.message || threw)) + '. Showing the simulated refusal instead.';
    liveStatus('unavailable', 'b-warn');
    liveOut('<div class="callout mono text-[12.5px]" style="color:#fde68a">' + esc(liveUnavailableReason) + '</div>');
    return;
  }
  // Confirm nothing moved: obligation state unchanged and no new receipt.
  let after = null, moved = false;
  try{
    after = await readObligationState(targetId);
    moved = !!(after && (after.state !== before.state));
  }catch(e){ /* state re-read failed; the tx hash itself is the proof — say so below */ }
  await refreshLive();
  const receiptsAfter = live.recTest && live.recTest.rows ? live.recTest.rows.length : null;
  if(receiptsBefore != null && receiptsAfter != null && receiptsAfter !== receiptsBefore) moved = true;
  liveAvailable = true;
  liveStatus('live refusal', 'b-refused');
  liveOut('<div class="fadein">'
    + '<div class="attempt mb-3"><span class="att-label">live settle attempt · ' + esc(b.label.toLowerCase()) + ' · obligation ' + esc(targetId) + '</span><span class="flex items-center gap-2">' + badge('REFUSED', code) + '</span></div>'
    + '<div class="flex flex-wrap items-center gap-3"><span class="mono text-[11px] dim2 uppercase tracking-widest">real refusal tx</span>' + hashChip(txHash)
    + '<a class="btn btn-primary sm" href="' + EX_TX(txHash) + '" target="_blank" rel="noopener">Read it from the chain</a><span class="mono text-[12px] text-white">0 tokens moved</span></div>'
    + '<div class="mono text-[11px] dim2 mt-3">Checked after the refusal: obligation is still ' + esc(after ? after.state : before.state) + (moved ? ' — WARNING: state moved, see above.' : ' · no new receipt · nothing paid') + '. Attempt was your choice (simulation); the refusal is a real on-chain verdict.</div>'
    + '</div>');
}

  +'<p class="dim leading-relaxed mb-3">Replays from genesis via paginated <span class="mono text-[12.5px] text-white">receipts(start, limit)</span>, recomputes every link, and detects gaps and mismatches. <b class="text-white">A tamper in receipt i is detected at receipt i+1</b> — even if the attacker recomputes receipt i’s stored hash, receipt i+1 still points at the original.</p>'
  +'<div class="space-y-2 mb-4">'+cmdBlock('verify')+cmdBlock('verifyCsv')+'</div>'
  +'<h3 class="text-white text-[15px] mb-3">--csv columns (frozen)</h3>'

function docsFilter(q){
  q=(q||'').trim().toLowerCase();
  let n=0;
  DOCS.forEach(d=>{
    const el=document.getElementById('doc-'+d.id); if(!el) return;
    const hay=(d.title+' '+d.body.replace(/<[^>]+>/g,' ')).toLowerCase();
    const hit=!q||hay.indexOf(q)>=0;
    el.style.display=hit?'':'none'; if(hit)n++;
    const nav=document.querySelector('#docnav a[data-doc="'+d.id+'"]'); if(nav) nav.style.opacity=hit?'':'0.35';
  });
  const c=document.getElementById('doccount'); if(c) c.textContent=q? n+' of '+DOCS.length+' sections match':'';
}

async function replayBrowser(){
  const out=document.getElementById('replayout'); const f=live.recTest;
  if(!out) return;
  if(!f.rows||!f.rows.length){ out.innerHTML='<div class="mt-2">'+unavail()+'</div>'; return; }
  out.innerHTML='';
  let ok=0;
  for(let i=0;i<f.rows.length;i++){
    await new Promise(r=>setTimeout(r,60));
    const row=document.getElementById('rx-'+i);
    const good=f.link.perRow[i];
    if(row) row.classList.add(good?'row-ok':'row-bad');
    if(good)ok++;
  }
  out.innerHTML='<div class="logline '+(ok===f.rows.length?'ok':'bad')+' fadein mt-3" style="font-weight:600">structural replay: '+ok+'/'+f.rows.length+' receipts · indices contiguous · prev_hash links '+(ok===f.rows.length?'intact':'BROKEN')+' · canonical SHA-256 recompute: cynex-verify (command above)</div>';
}

/* ============================================================
   ROUTER + INIT
   ============================================================ */
const app = document.getElementById('app');
function parseRoute(){ return (location.hash||'').replace(/^#\/?/,'').split('/').filter(Boolean); }
function setNav(page){
  document.querySelectorAll('#mainnav a').forEach(a=>a.classList.toggle('active', a.dataset.nav===page));
}
function render(){
  const p=parseRoute(); const page=p[0]||'landing';
  document.querySelectorAll('.tooltip').forEach(t=>t.remove());
  if(page==='demo'){
    const mode = p[1]==='sandbox' ? 'sandbox' : 'guided';
    setNav('demo'); document.title='Demo — Cynex';
    app.innerHTML = demoPage(mode);
    if(mode==='sandbox'){
      const flt=document.getElementById('pgfilter');
      if(flt) flt.onchange=()=>{ pgFilter=flt.value; document.getElementById('pgbody').innerHTML=pgRows(); };
      initTamper('sandbox');
    } else if(p[2]){
      setTimeout(()=>{ const el=document.getElementById('guided-'+p[2]); if(el){ el.scrollIntoView({behavior:'smooth',block:'start'}); el.style.scrollMarginTop='90px'; } },80);
    }
  }
  else if(page==='docs'){
    setNav('docs'); document.title='Docs — Cynex';
    app.innerHTML = docsPage(p[1]);
    const s=document.getElementById('docsearch');
    if(s) s.oninput=()=>docsFilter(s.value);
    if(p[1]) setTimeout(()=>{ const el=document.getElementById('doc-'+p[1]); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); },80);
  }
  else if(page==='proof'){
    setNav('proof'); document.title='Proof — Cynex';
    app.innerHTML = proofPage();
    initTamper('proof');
  }
  else {
    setNav('landing'); document.title='Cynex — Pay the obligation. Not the prompt.';
    app.innerHTML = landingPage();
    setTimeout(()=>chainRead(12), 1200); /* the one live proof: chain read after it */
  }
  if(!p[2] && page!=='docs') window.scrollTo(0,0);
  renderLiveRegions();
  refreshLive();
}

/* global delegation */
document.addEventListener('click', e=>{
  const cp = e.target.closest('[data-copy],[data-cp]');
  if(cp){
    const t = cp.dataset.cp ? CP[cp.dataset.cp] : cp.dataset.copy;
    if(t!=null && navigator.clipboard){
      navigator.clipboard.writeText(t).then(()=>{
        const old=cp.innerHTML; cp.innerHTML=IC.check; cp.classList.add('copied');
        setTimeout(()=>{ cp.innerHTML=old; cp.classList.remove('copied'); },1100);
      }).catch(()=>{});
    }
    return;
  }
  const cr=e.target.closest('[data-chainread]'); if(cr){ chainRead(Number(cr.dataset.chainread)); return; }
  const brk=e.target.closest('[data-break]'); if(brk){ renderBreak(Number(brk.dataset.break)); return; }
  const lv=e.target.closest('[data-live-try]'); if(lv){ tryLiveAttack(Number(lv.dataset.liveTry || 0)); return; }
  const atk=e.target.closest('[data-attack]'); if(atk){ runAttack(Number(atk.dataset.attack)); return; }
  const row=e.target.closest('tr[data-row]');
  if(row){ const i=Number(row.dataset.row); pgSelected=i;
    const d=document.getElementById('pgdetail'); if(d){ d.innerHTML=pgDetail(i); d.scrollIntoView({behavior:'smooth',block:'nearest'}); } return; }
  const rp=e.target.closest('[data-replay]'); if(rp){ replayBrowser(); return; }
  const rt=e.target.closest('[data-retry-live]'); if(rt){ refreshLive(); return; }
});

/* optional: refresh playground fixture from the repo when reachable */
(async function tryRepoFixture(){
  try{
    const ctl=new AbortController(); setTimeout(()=>ctl.abort(),6000);
    const r=await fetch('https://raw.githubusercontent.com/Jayanng/Cynex/master/demo/playground-obligations.json',{signal:ctl.signal});
    if(!r.ok) return;
    const j=await r.json();
    const arr=Array.isArray(j)?j:(j&&j.obligations);
    if(Array.isArray(arr)&&arr.length===18&&arr.every(o=>o&&(o.id||o.obligation_id))){
      PLAYGROUND=arr.map(o=>({id:o.id||o.obligation_id, ev:o.ev||o.evidence||'PREIMAGE', amount:String(o.amount??'—'), nonce:o.nonce??'—',
        expect:o.expect||o.expected||'PAID', ro:!!(o.ro||o.settleable===false), tx:o.tx||null, receipt:o.receipt||null, note:o.note||o.scenario||''}));
      playgroundSource='fetched live from repo master · demo/playground-obligations.json';
      const p=parseRoute(); if(p[0]==='demo'&&p[1]==='sandbox') render();
    }
  }catch(e){/* bundled snapshot stays, labeled */}
})();

window.addEventListener('hashchange', render);
setInterval(()=>{ if(document.querySelector('[data-live-region]')) refreshLive(); }, 5000);
render();
