[package]
name = "ft_test_token"
description = "Minimal fungible token for the Cynex near-sandbox suite only, never for production"
version = "0.1.0"
edition = "2024"
resolver = "3"
rust-version = "1.93"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.29"

[dev-dependencies]
near-sdk = { version = "5.29", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
# Tell `rustc` to optimize for small code size.
opt-level = "z"
lto = true
debug = false
panic = "abort"
# Opt into extra safety checks on arithmetic operations, same as the vault.
overflow-checks = true
